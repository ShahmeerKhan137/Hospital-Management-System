# 1. user-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: shahmeer138/hms-user:v1
          resources:
            requests:
              memory: "350Mi"
              cpu: "100m"
            limits:
              memory: "650Mi"
              cpu: "500m"
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx300m -XX:+UseG1GC"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: hms
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: user-service

