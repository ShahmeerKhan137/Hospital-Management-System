# 6. gateway-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: shahmeer138/hms-gateway:v1
          resources:
            requests:
              memory: "350Mi"
              cpu: "100m"
            limits:
              memory: "650Mi"
              cpu: "500m"
          ports:
            - containerPort: 9000
          env:
            - name: SERVER_PORT
              value: "9000"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx300m -XX:+UseG1GC"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka/"
            - name: SPRING_APPLICATION_JSON
              value: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://eureka-service:8761/eureka/"}}},"spring":{"cloud":{"gateway":{"globalcors":{"cors-configurations":{"[''/**'']":{"allowedOrigins":["*"],"allowedMethods":["*"],"allowedHeaders":["*"]}}}}}}}'
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: hms
spec:
  type: NodePort
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30080
  selector:
    app: gateway-service