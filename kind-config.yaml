kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # Control Plane (Master Node) with Port Mappings
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  # Worker Node 1
  - role: worker
  # Worker Node 2
  - role: worker